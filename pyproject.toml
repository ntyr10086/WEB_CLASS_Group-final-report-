[project]
name = "flood-rush"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Linda", email = "s1130308@pu.edu.tw" }
]
requires-python = "==3.12.*"
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "gunicorn>=22.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "simple-websocket>=1.0",
]

[project.scripts]
flood-rush = "flood_rush:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
